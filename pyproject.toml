[project]
name = "zlog"
version = "0.0.1"
description = "zlog pipeline prototype — local CLI that turns raw footage into a short Y2K-CCD-look vlog mp4"
requires-python = ">=3.11"
dependencies = [
    "scenedetect[opencv]>=0.6.4",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
    "librosa>=0.10.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
